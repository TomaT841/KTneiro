    //音色を追加できる
  ];

  const tableBody = document.querySelector("#sound-table tbody");

  soundData.forEach((sound, index) => {
    const row = document.createElement("tr");

    // 音色名
    const nameCell = document.createElement("td");
    nameCell.textContent = sound.name;
    row.appendChild(nameCell);

    // 再生ボタン
    const buttonCell = document.createElement("td");
    const button = document.createElement("button");
    button.classList.add("play-button");
    button.dataset.audio = `audio${index + 1}`;
    button.textContent = "▶";
    buttonCell.appendChild(button);
    row.appendChild(buttonCell);

    // 番号
    const numberCell = document.createElement("td");
    numberCell.textContent = String(index + 1).padStart(3, "0");
    row.appendChild(numberCell);

    // 余韻設定
    const echoCell = document.createElement("td");
    echoCell.textContent = sound.echo === 1 ? "〇" : ""; // echo が1の時に〇を表示
    row.appendChild(echoCell);

    tableBody.appendChild(row);

    // 動的にaudioタグを追加
    const audio = document.createElement("audio");
    audio.id = `audio${index + 1}`;
    audio.src = `audio/${sound.file}`;
    document.body.appendChild(audio);
  });

  const buttons = document.querySelectorAll(".play-button");
  let currentAudio = null;
  let currentButton = null;

  buttons.forEach(button => {
    button.addEventListener("click", () => {
      const audioId = button.dataset.audio;
      const audio = document.getElementById(audioId);

      // 他の音を止める
      if (currentAudio && currentAudio !== audio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        if (currentButton) currentButton.textContent = "▶";
      }

      // 再生／停止の切り替え
      if (audio.paused) {
        audio.play();
        button.textContent = "■";
        currentAudio = audio;
        currentButton = button;
      } else {
        audio.pause();
        audio.currentTime = 0;
        button.textContent = "▶";
        currentAudio = null;
        currentButton = null;
      }

      // 再生終了時にアイコンを戻す
      audio.onended = () => {
        button.textContent = "▶";
        currentAudio = null;
        currentButton = null;
      };
    });
  });
